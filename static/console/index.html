<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pocket Console</title>
<link rel="stylesheet" href="/console/static/style.css">
<link rel="manifest" href="/console/manifest.json">
<meta name="theme-color" content="#0e1116">
<link rel="icon" href="/console/static/icon.svg" type="image/svg+xml">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pocket">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand">Pocket <span class="brand-dim">Console</span></div>
    <nav id="mode-nav">
      <button class="mode-btn active" data-mode="agents">Agents</button>
      <button class="mode-btn" data-mode="files">檔案</button>
      <button class="mode-btn" data-mode="changes">變更</button>
      <button class="mode-btn" data-mode="term">終端機</button>
      <button class="mode-btn" data-mode="memory">記憶</button>
    </nav>
    <button id="awaiting" class="awaiting hidden" title="有 session 在等你放行">
      <span id="awaiting-n">0</span> 件待審核
    </button>
    <span id="usage" class="usage hidden" title="今日用量／花費"></span>
    <div id="conn" class="conn" title="連線狀態"><span class="dot"></span><span id="conn-text">連線中…</span></div>
  </header>

  <main id="main">
    <!-- 左:session 列表 -->
    <aside id="sidebar">
      <div class="side-head">
        <span>Sessions</span>
        <button id="newsess-open" class="icon-btn" title="開新工作">＋</button>
        <button id="refresh" class="icon-btn" title="重新整理">↻</button>
      </div>
      <div id="session-list"><div class="empty">載入中…</div></div>
    </aside>

    <!-- 右:卡片流 -->
    <section id="stream">
      <div id="stream-head" class="stream-head hidden">
        <div class="sh-title"><span id="sh-provider" class="pill"></span><span id="sh-name"></span></div>
        <div class="sh-actions">
          <span id="sh-status" class="status-chip"></span>
          <button id="interrupt" class="btn btn-danger" title="中斷目前回合">■ 中斷</button>
        </div>
      </div>
      <div id="approval" class="approval hidden">
        <div class="ap-head">
          <span class="ap-icon">🔐</span>
          <span id="ap-title" class="ap-title"></span>
        </div>
        <div id="ap-actions" class="ap-actions"></div>
      </div>
      <div id="cards"><div class="placeholder">← 從左邊選一條 session</div></div>
      <div id="atts" class="atts hidden"></div>
      <form id="composer" class="composer hidden">
        <input id="file-pick" type="file" multiple class="hidden-input">
        <button id="attach" class="btn-ghost" type="button" title="附加檔案（也可拖放或貼上）">📎</button>
        <textarea id="input" rows="1" placeholder="送到這條 session…（⌘/Ctrl+Enter 送出）"></textarea>
        <button id="send" class="btn btn-primary" type="submit">送出</button>
      </form>
    </section>

    <!-- 第三欄:寬螢幕才出現(P2)。右側常駐「這條 session 改了什麼」,
         不必切到「變更」分頁 —— 筆電有橫向空間,別浪費。 -->
    <aside id="rail" class="rail">
      <div class="side-head"><span>這輪改了什麼</span>
        <button id="rail-reload" class="icon-btn" title="重新整理">↻</button></div>
      <div id="rail-list" class="rail-list"><div class="empty">選一條 session</div></div>
    </aside>
  </main>

  <!-- 檔案瀏覽模式 -->
  <section id="files-view" class="hidden">
    <div id="fb-bar" class="fb-bar">
      <button id="fb-up" class="btn-ghost" title="上一層">↑</button>
      <div id="fb-crumb" class="fb-crumb"></div>
    </div>
    <div id="fb-body" class="fb-body">
      <div id="fb-list" class="fb-list"></div>
      <div id="fb-preview" class="fb-preview"><div class="placeholder">← 選一個檔案預覽</div></div>
    </div>
  </section>

  <!-- 變更檢視模式(P0-3) -->
  <section id="changes-view" class="hidden">
    <div class="ch-bar">
      <span id="ch-session" class="ch-session">先在 Agents 選一條 session</span>
      <button id="ch-reload" class="btn-ghost" title="重新整理">↻</button>
    </div>
    <div class="ch-body">
      <div id="ch-list" class="ch-list"></div>
      <pre id="ch-diff" class="ch-diff"><div class="placeholder">← 選一個檔案看它改了什麼</div></pre>
    </div>
  </section>

  <!-- 終端機(PTY over WebSocket) -->
  <section id="term-view" class="hidden">
    <div class="tm-bar">
      <input id="tm-name" class="mem-input tm-name" value="console"
             title="tmux session 名稱 —— 帶同一個名字重連就接回同一條 shell">
      <button id="tm-connect" class="btn btn-primary">連線</button>
      <button id="tm-clear" class="btn-ghost" title="清畫面（不影響遠端）">清除</button>
      <span id="tm-status" class="tm-status bad">未連線</span>
    </div>
    <pre id="tm-out" class="tm-out"></pre>
    <div class="tm-inbar">
      <input id="tm-in" class="tm-in" placeholder="輸入指令後按 Enter（Ctrl+C 中斷、Tab 補全）" autocomplete="off" spellcheck="false">
    </div>
    <div class="tm-note">全螢幕 TUI（vim／tmux 內層）不會正確顯示 —— 這一頁是給跑指令和看 log 用的。</div>
  </section>

  <!-- 記憶檢索模式 -->
  <section id="memory-view" class="hidden">
    <div class="mem-bar">
      <input id="mem-q" class="mem-input" placeholder="搜尋所有 session 的長久記憶（CC / CX / 人格）…">
      <select id="mem-prov" class="mem-sel">
        <option value="">全部</option><option value="cc">CC</option>
        <option value="cx">CX</option><option value="hermes">人格</option>
      </select>
      <button id="mem-go" class="btn btn-primary">搜尋</button>
    </div>
    <div id="mem-results" class="mem-results"><div class="placeholder">輸入關鍵字，跨所有 session 找「當時做了什麼、改了哪、結論是什麼」</div></div>
  </section>

  <!-- ⌘K 快速切換 -->
  <div id="palette" class="palette hidden">
    <div class="pal-box">
      <input id="pal-q" class="pal-q" placeholder="切換 session…（↑↓ 選，Enter 開，Esc 關）" autocomplete="off">
      <div id="pal-list" class="pal-list"></div>
    </div>
  </div>

  <!-- 開新工作 -->
  <div id="newsess" class="palette hidden">
    <div class="pal-box ns-box">
      <div class="ns-row">
        <label for="new-kind">類型</label>
        <select id="new-kind" class="mem-sel">
          <option value="cc">Claude Code</option>
          <option value="cx">Codex</option>
        </select>
      </div>
      <div class="ns-row">
        <label for="new-name">名稱／任務</label>
        <input id="new-name" class="mem-input" placeholder="CC 是 session 名；CX 是第一句任務">
      </div>
      <div class="ns-row">
        <label for="new-dir">工作目錄</label>
        <input id="new-dir" class="mem-input" placeholder="留空 = 預設 home">
      </div>
      <div class="ns-actions">
        <button id="newsess-cancel" class="btn-ghost">取消</button>
        <button id="newsess-go" class="btn btn-primary">開始</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
</div>
<script src="/console/static/sse.js"></script>
<script src="/console/static/app.js"></script>
<script src="/console/static/filebrowser.js"></script>
<script src="/console/static/changes.js"></script>
<script src="/console/static/terminal.js"></script>
<script src="/console/static/memory.js"></script>
</body>
</html>
